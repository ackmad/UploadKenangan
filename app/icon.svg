<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1714"/>
      <stop offset="100%" stop-color="#0f0d0b"/>
    </radialGradient>
    <!-- Gold gradient for text -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5a5"/>
      <stop offset="35%" stop-color="#c9a96e"/>
      <stop offset="65%" stop-color="#d4b87c"/>
      <stop offset="100%" stop-color="#b8944c"/>
    </linearGradient>
    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(201,169,110,0.4)"/>
      <stop offset="50%" stop-color="rgba(201,169,110,0.15)"/>
      <stop offset="100%" stop-color="rgba(201,169,110,0.35)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="3" y="3" width="506" height="506" rx="94" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
  
  <!-- Ambient glow circle -->
  <circle cx="256" cy="240" r="160" fill="rgba(201,169,110,0.04)"/>
  
  <!-- "21" text with gold gradient -->
  <text x="256" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="260" fill="url(#gold)" filter="url(#glow)" letter-spacing="-8">21</text>
  
  <!-- Small decorative star -->
  <text x="256" y="410" text-anchor="middle" font-size="28" fill="rgba(201,169,110,0.5)">✦</text>
</svg>
